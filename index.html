<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Email Threat Forensics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0d1015; --sidebar:#12161d; --card:#151a22; --card-2:#1a2029; --line:#242b37; --line-soft:#1b212b;
    --ink:#eae7e0; --ink-dim:#98a0ac; --ink-faint:#565d69;
    --amber:#c98a3d; --amber-soft:#e3b678; --amber-bg:#241c10; --amber-line:#493a20;
    --red:#c1443c; --red-soft:#e88f89; --red-bg:#241512; --red-line:#4a2a26;
    --green:#4f9b72; --green-soft:#8fc9a8; --green-bg:#141f19; --green-line:#284537;
    --font-sans:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
    --radius:8px; --radius-sm:5px;
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 24px -12px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-sans);
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--amber);}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  ::selection{background:var(--amber-bg); color:var(--amber-soft);}
  svg.ic{display:block; flex-shrink:0;}

  .app{display:grid; grid-template-columns:296px 1fr; min-height:100vh;}
  @media (max-width:960px){ .app{grid-template-columns:1fr;} .sidebar{border-right:none; border-bottom:1px solid var(--line);} }

  /* ---------- header ---------- */
  header.top{
    grid-column:1/-1; display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px; border-bottom:1px solid var(--line); background:var(--sidebar);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .wordmark{font-weight:600; font-size:15.5px; letter-spacing:.01em;}
  .brand .tagline{font-size:12.5px; color:var(--ink-faint); margin-left:10px; padding-left:10px; border-left:1px solid var(--line);}
  @media (max-width:680px){ .brand .tagline{display:none;} }
  .status{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-dim);}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); transition:background .3s;}
  .dot.online{background:var(--green); box-shadow:0 0 0 3px var(--green-bg);}
  .dot.offline{background:var(--red); box-shadow:0 0 0 3px var(--red-bg);}

  /* ---------- sidebar ---------- */
  .sidebar{
    border-right:1px solid var(--line); background:var(--sidebar); padding:20px;
    display:flex; flex-direction:column; gap:22px;
  }
  .field-label{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-dim); margin:0 0 9px; font-weight:500;}
  textarea{
    width:100%; min-height:142px; background:var(--card-2); color:var(--ink);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px; font-family:var(--font-mono);
    font-size:12px; line-height:1.6; resize:vertical;
  }
  textarea::placeholder{color:var(--ink-faint); font-family:var(--font-sans);}
  textarea:focus{outline:none; border-color:var(--amber-line); box-shadow:0 0 0 3px var(--amber-bg);}

  .filerow{margin-top:9px;}
  input[type=file]{font-size:12px; color:var(--ink-dim); max-width:100%;}
  input[type=file]::file-selector-button{
    font-family:var(--font-sans); font-size:12px; background:var(--card-2); color:var(--ink);
    border:1px solid var(--line); border-radius:4px; padding:5px 10px; margin-right:8px; cursor:pointer;
  }

  button{
    font-family:var(--font-sans); font-size:13px; font-weight:500; cursor:pointer;
    border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--card-2); color:var(--ink);
    padding:9px 14px; transition:border-color .15s, background .15s, transform .1s;
  }
  button:hover{border-color:var(--ink-faint);}
  button:active{transform:translateY(1px);}
  button.primary{
    background:var(--amber); color:#241a0c; border-color:var(--amber); width:100%; margin-top:11px; font-weight:600;
  }
  button.primary:hover{background:#dd9c4c;}
  button.primary:disabled{opacity:.5; cursor:default; background:var(--amber);}
  .sample-links{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .sample-links button{font-size:11.5px; padding:5px 10px;}

  .divider{border-top:1px solid var(--line); margin:0;}

  .case-list{display:flex; flex-direction:column; gap:5px; max-height:300px; overflow-y:auto; margin-top:2px;}
  .case-item{
    border-radius:var(--radius-sm); padding:9px 10px; cursor:pointer; border:1px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .case-item:hover{background:var(--card-2); border-color:var(--line);}
  .case-item .subj{font-size:12.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .case-item .meta{display:flex; justify-content:space-between; align-items:center; margin-top:4px;}
  .case-item .from{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .score-chip{font-family:var(--font-mono); font-weight:600; font-size:11px; padding:1px 6px; border-radius:3px; flex-shrink:0;}
  .score-chip.high{background:var(--red-bg); color:var(--red-soft);}
  .score-chip.med{background:var(--amber-bg); color:var(--amber-soft);}
  .score-chip.low{background:var(--green-bg); color:var(--green-soft);}
  .empty-hint{color:var(--ink-faint); font-size:12.5px; line-height:1.6;}

  /* ---------- main ---------- */
  main{padding:0; min-width:0;}
  .placeholder-wrap{padding:110px 32px; display:flex; justify-content:center;}
  .placeholder{color:var(--ink-faint); text-align:center; font-size:13.5px; max-width:360px; line-height:1.7;}
  .placeholder svg{margin-bottom:18px; opacity:.35;}

  .dash{max-width:1180px; margin:0 auto; padding:28px 32px 60px;}

  /* case title row */
  .case-title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
  .case-title-row .case-tag{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-bottom:6px;}
  .case-title-row h1{font-size:20px; font-weight:600; margin:0 0 7px; line-height:1.35; max-width:560px;}
  .case-title-row .from-line{font-size:13px; color:var(--ink-dim);}
  .case-title-row .from-line b{color:var(--ink); font-weight:500;}
  .verdict-pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 11px; border-radius:99px; font-weight:500; margin-top:2px; white-space:nowrap;}
  .verdict-pill.high{background:var(--red-bg); color:var(--red-soft); border:1px solid var(--red-line);}
  .verdict-pill.med{background:var(--amber-bg); color:var(--amber-soft); border:1px solid var(--amber-line);}
  .verdict-pill.low{background:var(--green-bg); color:var(--green-soft); border:1px solid var(--green-line);}
  .verdict-pill .vdot{width:6px; height:6px; border-radius:50%; background:currentColor;}

  /* KPI strip */
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
  @media (max-width:760px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
  .kpi{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
    display:flex; flex-direction:column; gap:8px;
  }
  .kpi .kpi-top{display:flex; align-items:center; justify-content:space-between; color:var(--ink-faint);}
  .kpi .kpi-label{font-size:11.5px;}
  .kpi .kpi-val{font-family:var(--font-mono); font-size:22px; font-weight:600; color:var(--ink);}
  .kpi .kpi-sub{font-size:11px; color:var(--ink-faint);}
  .kpi.accent-high .kpi-val{color:var(--red-soft);}
  .kpi.accent-med .kpi-val{color:var(--amber-soft);}
  .kpi.accent-low .kpi-val{color:var(--green-soft);}

  /* card grid */
  .grid{display:grid; grid-template-columns:repeat(12,1fr); gap:16px;}
  .c4{grid-column:span 4;} .c5{grid-column:span 5;} .c6{grid-column:span 6;}
  .c7{grid-column:span 7;} .c8{grid-column:span 8;} .c12{grid-column:span 12;}
  @media (max-width:900px){ .grid > *{grid-column:span 12 !important;} }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow); min-width:0;
  }
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:15px;}
  .card-head .ht{display:flex; align-items:center; gap:9px;}
  .card-head h2{font-size:13.5px; font-weight:600; color:var(--ink); margin:0;}
  .card-head .icon-badge{
    width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:var(--card-2); border:1px solid var(--line); color:var(--amber-soft); flex-shrink:0;
  }
  .card-head .sec-sub{font-size:11.5px; color:var(--ink-faint);}

  /* threat score card */
  .score-card{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .gauge-wrap{position:relative; width:148px; height:148px; margin:4px 0 10px;}
  .gauge-wrap .gauge-num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge-wrap .gauge-num .n{font-family:var(--font-mono); font-weight:600; font-size:34px; line-height:1;}
  .gauge-wrap .gauge-num .lbl{font-size:10.5px; color:var(--ink-faint); margin-top:3px; letter-spacing:.02em;}
  .breakdown{width:100%; display:flex; flex-direction:column; gap:9px; margin-top:6px;}
  .breakdown-row{display:grid; grid-template-columns:118px 1fr 30px; align-items:center; gap:9px;}
  .breakdown-row .bl{font-size:11.5px; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .breakdown-bar{height:5px; background:var(--card-2); border-radius:3px; overflow:hidden;}
  .breakdown-fill{height:100%; background:var(--amber); border-radius:3px;}
  .breakdown-row .bv{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); text-align:right;}

  .reasons{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px;}
  .reasons li{font-size:13.5px; padding-left:16px; position:relative; color:var(--ink);}
  .reasons li::before{content:''; position:absolute; left:0; top:7px; width:6px; height:6px; border-radius:50%; background:var(--ink-faint);}
  .reasons.high li::before{background:var(--red);}
  .reasons.med li::before{background:var(--amber);}

  .auth-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden;}
  .auth-card{background:var(--card-2); padding:13px 8px; text-align:center;}
  .auth-card .label{font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono); letter-spacing:.03em;}
  .auth-card .val{font-family:var(--font-mono); font-size:15px; font-weight:600; margin-top:5px; text-transform:uppercase;}
  .auth-card.pass .val{color:var(--green);}
  .auth-card.fail .val{color:var(--red);}
  .auth-card.none .val{color:var(--ink-faint);}

  .relay-chain{display:flex; flex-direction:column;}
  .hop{display:flex; gap:12px; padding:9px 0; border-left:2px solid var(--line); position:relative; padding-left:16px;}
  .hop:last-child{padding-bottom:0;}
  .hop::before{content:''; position:absolute; left:-5px; top:13px; width:8px; height:8px; border-radius:50%; background:var(--ink-faint); border:2px solid var(--card);}
  .hop:first-child::before{background:var(--amber);}
  .hop-num{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); min-width:14px; padding-top:1px;}
  .hop-detail{font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); line-height:1.7;}
  .hop-detail .ip{color:var(--ink); font-weight:600;}
  .hop-detail .host{color:var(--ink-faint);}

  #map{height:220px; border-radius:6px; margin-bottom:14px; background:var(--card-2);}
  .geo-facts{display:grid; grid-template-columns:repeat(2,1fr); gap:10px 16px;}
  .geo-facts .gf{font-size:12.5px;}
  .geo-facts .gf .k{color:var(--ink-faint); font-size:10.5px; font-family:var(--font-mono); margin-bottom:2px;}
  .geo-facts .gf .v{color:var(--ink);}
  .geo-unavailable{color:var(--ink-faint); font-size:12.5px; padding:24px 16px; text-align:center; border:1px dashed var(--line); border-radius:6px; line-height:1.7;}

  .phrase-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .phrase{font-family:var(--font-mono); font-size:11px; padding:3px 8px; border-radius:3px; background:var(--amber-bg); color:var(--amber-soft); border:1px solid var(--amber-line);}
  .prob-row{display:flex; align-items:center; gap:10px;}
  .prob-bar{flex:1; height:5px; background:var(--card-2); border-radius:3px; overflow:hidden;}
  .prob-fill{height:100%; background:var(--amber); border-radius:3px;}
  .prob-val{font-family:var(--font-mono); font-size:13px; min-width:38px; text-align:right;}

  .url-item{padding:11px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px;}
  .url-item:last-child{border-bottom:none;}
  .url-item .u{font-family:var(--font-mono); font-size:12px; color:var(--ink); word-break:break-all;}
  .url-item ul{margin:6px 0 0; padding-left:16px; color:var(--red-soft); font-family:var(--font-sans); font-size:12.5px;}

  .kv-table{display:flex; flex-direction:column;}
  .kv-row{display:grid; grid-template-columns:170px 1fr; gap:16px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row .k{color:var(--ink-faint); font-size:12px;}
  .kv-row .v{color:var(--ink); font-family:var(--font-mono); font-size:12.5px;}

  .footer-actions{margin-top:18px;}
  .loading{color:var(--ink-faint); font-size:13.5px; padding:90px 30px; text-align:center;}
  .error-box{border:1px solid var(--red-line); background:var(--red-bg); color:var(--red-soft); border-radius:var(--radius-sm); padding:11px 13px; font-size:12.5px; margin-top:10px; line-height:1.6;}

  /* ---------- forensic evidence states ---------- */
  .evidence-banner{
    display:flex; align-items:center; gap:13px; padding:14px 16px; margin-bottom:18px;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--card);
  }
  .evidence-icon{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; border:1px solid var(--line); flex-shrink:0;
  }
  .evidence-title{font-size:13px; font-weight:600;}
  .evidence-description{font-size:11.5px; color:var(--ink-dim); margin-top:2px; line-height:1.5;}
  .evidence-badge{
    margin-left:auto; padding:4px 8px; border-radius:99px; font-family:var(--font-mono);
    font-size:10px; font-weight:600; letter-spacing:.06em; flex-shrink:0;
  }
  .evidence-banner.full{border-color:var(--green-line);}
  .evidence-banner.full .evidence-icon{color:var(--green-soft); border-color:var(--green-line); background:var(--green-bg);}
  .evidence-banner.full .evidence-badge{color:var(--green-soft); background:var(--green-bg); border:1px solid var(--green-line);}
  .evidence-banner.partial{border-color:var(--amber-line);}
  .evidence-banner.partial .evidence-icon{color:var(--amber-soft); border-color:var(--amber-line); background:var(--amber-bg);}
  .evidence-banner.partial .evidence-badge{color:var(--amber-soft); background:var(--amber-bg); border:1px solid var(--amber-line);}
  .evidence-banner.limited{border-color:var(--red-line);}
  .evidence-banner.limited .evidence-icon{color:var(--red-soft); border-color:var(--red-line); background:var(--red-bg);}
  .evidence-banner.limited .evidence-badge{color:var(--red-soft); background:var(--red-bg); border:1px solid var(--red-line);}
  .forensic-unavailable{
    padding:17px; border:1px dashed var(--line); border-radius:6px; background:rgba(255,255,255,.012);
  }
  .unavailable-title{font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:4px;}
  .unavailable-message{font-size:11.5px; color:var(--ink-faint); line-height:1.65;}
  .origin-ip-box{
    margin-top:10px; padding:10px 12px; border:1px solid var(--line-soft); border-radius:6px;
    background:var(--card-2);
  }
  .origin-ip-box .k{font-size:10px; color:var(--ink-faint); font-family:var(--font-mono); text-transform:uppercase;}
  .origin-ip-box .v{font-size:14px; font-family:var(--font-mono); color:var(--ink); margin-top:3px;}
  @media (max-width:600px){
    .evidence-banner{align-items:flex-start;}
    .evidence-badge{margin-left:0;}
    .evidence-banner{flex-wrap:wrap;}
  }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="3" fill="#c98a3d"/>
        <path d="M12 2v4M12 18v4M22 12h-4M6 12H2" stroke="#c98a3d" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="8.5" stroke="#c98a3d" stroke-width="1.3" stroke-opacity=".45"/>
      </svg>
      <span class="wordmark">Sentinel</span>
      <span class="tagline">Email threat detection &amp; forensic intelligence</span>
    </div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">checking backend…</span>
    </div>
  </header>

  <div class="sidebar">
    <div>
      <p class="field-label">
        <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 7l9 6 9-6M3 7v10a1 1 0 001 1h16a1 1 0 001-1V7M3 7a1 1 0 011-1h16a1 1 0 011 1" stroke="#98a0ac" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Analyze an email
      </p>
      <textarea id="rawInput" placeholder="Paste raw email source here, including headers…"></textarea>
      <div class="filerow">
        <input type="file" id="fileInput" accept=".eml,.txt,message/rfc822">
      </div>
      <div class="sample-links">
        <button id="loadPhish">Load phishing sample</button>
        <button id="loadLegit">Load legitimate sample</button>
      </div>
      <button class="primary" id="analyzeBtn">Analyze email</button>
      <div id="apiError"></div>
    </div>
    <div class="divider"></div>
    <div>
      <p class="field-label">
        <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 8v4l3 2M21 12a9 9 0 11-9-9 9 9 0 019 9z" stroke="#98a0ac" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Case history
      </p>
      <div class="case-list" id="caseList">
        <p class="empty-hint">Analyzed emails will appear here.</p>
      </div>
    </div>
  </div>

  <main id="mainContent">
    <div class="placeholder-wrap">
      <div class="placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <path d="M3 7l9 6 9-6M3 7v10a1 1 0 001 1h16a1 1 0 001-1V7M3 7a1 1 0 011-1h16a1 1 0 011 1" stroke="#565d69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Paste an email or upload a .eml file to run header forensics, authentication checks, phishing-language detection, and origin geolocation.
      </div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const API_BASE = window.SENTINEL_API_BASE || "http://localhost:8000";

const ICONS = {
  shield: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  route: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="19" r="2.2" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="5" r="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M8 19h6a4 4 0 004-4V9a4 4 0 00-4-4h-.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  globe: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18" stroke="currentColor" stroke-width="1.4"/></svg>`,

async function checkHealth(){
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  try{
    const r = await fetch(`${API_BASE}/api/health`);
    if(!r.ok) throw new Error();
    const d = await r.json();
    dot.className = 'dot online';
    txt.textContent = `backend online · ${d.cases_analyzed} case${d.cases_analyzed===1?'':'s'} analyzed`;
  }catch(e){
    dot.className = 'dot offline';
    txt.textContent = 'backend offline — start the FastAPI server';
  }
}
checkHealth();
setInterval(checkHealth, 8000);

function tier(score){
  if(score >= 70) return 'high';
  if(score >= 40) return 'med';
  return 'low';
}
const TIER_COLOR = { high:'#c1443c', med:'#c98a3d', low:'#4f9b72' };
const TIER_LABEL = { high:'High risk', med:'Medium risk', low:'Low risk' };

function gaugeSvg(score, t){
  const r = 60, c = 2*Math.PI*r;
  const pct = Math.max(0, Math.min(100, score)) / 100;
  const offset = c * (1 - pct);
  return `<svg width="148" height="148" viewBox="0 0 148 148">
    <circle cx="74" cy="74" r="${r}" fill="none" stroke="#242b37" stroke-width="10"/>
    <circle cx="74" cy="74" r="${r}" fill="none" stroke="${TIER_COLOR[t]}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"
      transform="rotate(-90 74 74)" style="transition:stroke-dashoffset .6s ease"/>
  </svg>`;
}

const BREAKDOWN_META = [
  { key:'ml_text_contribution', label:'Language model', max:30 },
  { key:'auth_failure_contribution', label:'Auth failures', max:20 },
  { key:'alignment_mismatch_contribution', label:'Sender alignment', max:15 },
  { key:'suspicious_url_contribution', label:'Suspicious links', max:15 },
  { key:'lookalike_domain_contribution', label:'Lookalike domain', max:10 },
  { key:'suspicious_tld_contribution', label:'Suspicious TLD', max:5 },
  { key:'proxy_hosting_contribution', label:'Proxy / hosting origin', max:5 },
];

async function analyze(){
  const btn = document.getElementById('analyzeBtn');
  const errBox = document.getElementById('apiError');
  errBox.innerHTML = '';
  const fileInput = document.getElementById('fileInput');
  const raw = document.getElementById('rawInput').value.trim();

  if(!raw && (!fileInput.files || fileInput.files.length === 0)){
    errBox.innerHTML = '<div class="error-box">Paste an email or choose a .eml file first.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Analyzing…';
  document.getElementById('mainContent').innerHTML = '<div class="loading">Running header forensics, authentication checks and language analysis…</div>';

  try{
    let resp;
    if(fileInput.files && fileInput.files.length > 0){
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      resp = await fetch(`${API_BASE}/api/analyze/file`, { method:'POST', body: fd });
    }else{
      resp = await fetch(`${API_BASE}/api/analyze/text`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ raw_email: raw })
      });
    }
    if(!resp.ok){
      const t = await resp.text();
      throw new Error(t || `Request failed (${resp.status})`);
    }
    const data = await resp.json();
    renderCase(data);
    loadCaseList();
    checkHealth();
  }catch(e){
    document.getElementById('mainContent').innerHTML = `<div class="placeholder-wrap"><div class="placeholder">Analysis failed — check the backend is running, then try again.</div></div>`;
    errBox.innerHTML = `<div class="error-box">${escapeHtml(e.message || String(e))}</div>`;
  }finally{
    btn.disabled = false;
    btn.textContent = 'Analyze email';
  }
}
document.getElementById('analyzeBtn').onclick = analyze;

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function loadCaseList(){
  const list = document.getElementById('caseList');
  try{
    const r = await fetch(`${API_BASE}/api/cases`);
    const cases = await r.json();
    if(cases.length === 0){
      list.innerHTML = '<p class="empty-hint">Analyzed emails will appear here.</p>';
      return;
    }
    list.innerHTML = cases.map(c => `
      <div class="case-item" data-id="${c.case_id}">
        <div class="subj">${escapeHtml(c.subject || '(no subject)')}</div>
        <div class="meta">
          <span class="from">${escapeHtml((c.from||'').slice(0,30))}</span>
          <span class="score-chip ${tier(c.fraud_score)}">${c.fraud_score}</span>
        </div>
      </div>`).join('');
    list.querySelectorAll('.case-item').forEach(el => {
      el.onclick = async () => {
        const r = await fetch(`${API_BASE}/api/cases/${el.dataset.id}`);
        const data = await r.json();
        renderCase(data);
      };
    });
  }catch(e){ /* backend offline, leave as is */ }
}

let leafletMap = null;
function getEvidenceQuality(d){
  const relay = Array.isArray(d.relay_chain) ? d.relay_chain : [];
  const auth = d.auth_results || {};
  const hasRelay = relay.length > 0;
  const hasOrigin = !!d.origin_ip;
  const authValues = ['spf','dkim','dmarc'].map(k => String(auth[k] || '').toLowerCase());
  const hasAuthEvidence = authValues.some(v => ['pass','fail','softfail'].includes(v));

  if(hasRelay && hasOrigin && hasAuthEvidence){
    return {
      level:'FULL',
      cls:'full',
      label:'Full forensic evidence',
      description:'Original transport headers provide relay, origin and authentication evidence.'
    };
  }

  const hasUsefulEvidence =
    hasRelay || hasOrigin || hasAuthEvidence ||
    (d.url_signals && Array.isArray(d.url_signals.total_urls) ? d.url_signals.total_urls > 0 : Number(d.url_signals?.total_urls || 0) > 0) ||
    !!d.domain_report;

  if(hasUsefulEvidence){
    return {
      level:'PARTIAL',
      cls:'partial',
      label:'Partial forensic evidence',
      description:'Some forensic evidence is available, but original transport headers may be incomplete.'
    };
  }

  return {
    level:'LIMITED',
    cls:'limited',
    label:'Limited forensic evidence',
    description:'The supplied email representation contains mainly content-level evidence.'
  };
}

function evidenceBanner(d){
  const e = getEvidenceQuality(d);
  const icon = e.level === 'FULL' ? '✓' : '!';
  return `
    <div class="evidence-banner ${e.cls}">
      <div class="evidence-icon">${icon}</div>
      <div>
        <div class="evidence-title">${escapeHtml(e.label)}</div>
        <div class="evidence-description">${escapeHtml(e.description)}</div>
      </div>
      <div class="evidence-badge">${e.level}</div>
    </div>
  `;
}

function unavailableCard(title, message){
  return `
    <div class="forensic-unavailable">
      <div class="unavailable-title">${escapeHtml(title)}</div>
      <div class="unavailable-message">${escapeHtml(message)}</div>
    </div>
  `;
}

function renderAuthState(v){
  const value = String(v || '').toLowerCase().trim();

  if(value === 'pass') return {cls:'pass', label:'PASS'};
  if(['fail','softfail','temperror','permerror'].includes(value)) return {cls:'fail', label:value.toUpperCase()};
  if(value === 'none') return {cls:'none', label:'NOT PRESENT'};
  if(['unknown','unavailable',''].includes(value)) return {cls:'none', label:'UNKNOWN'};

  return {cls:'none', label:value.toUpperCase()};
}

      if(!mapEl || typeof L === 'undefined') return;
      if(leafletMap){ leafletMap.remove(); }
      leafletMap = L.map('map', {zoomControl:true, attributionControl:true}).setView([geo.lat, geo.lon], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution:'© OpenStreetMap contributors', maxZoom:18
      }).addTo(leafletMap);
      L.circleMarker([geo.lat, geo.lon], {radius:8, color:'#c1443c', fillColor:'#c1443c', fillOpacity:0.6})
        .addTo(leafletMap)
        .bindPopup(`${escapeHtml(geo.city||'')}, ${escapeHtml(geo.country||'')}<br>${escapeHtml(geo.isp||'')}`);
    }, 50);
  }
}

function downloadReport(jsonStr){
  const data = JSON.parse(jsonStr);
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `forensic-report-${data.case_id}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
